<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Luo äänestys</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="container mt-4">

  <h1>Luo äänestys</h1>

  <form id="createPollForm">
    <div class="mb-3">
      <label for="pollQuestion" class="form-label">Kysymys</label>
      <input type="text" class="form-control" id="pollQuestion" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Vaihtoehdot</label>
      <input type="text" class="form-control mb-1" required>
      <input type="text" class="form-control mb-1" required>
      <input type="text" class="form-control mb-1">
    </div>

    <div class="mb-3">
      <label for="deadline" class="form-label">Aikaraja</label>
      <input type="date" class="form-control" id="deadline" required>
    </div>

    <button type="button" class="btn btn-primary" onclick="createPoll()">Luo äänestys</button>
  </form>

  <script>
    function createPoll() {
      alert("Uusi äänestys luotu!");
      document.getElementById('createPollForm').reset();
    }
  </script>

</body>
</html>
