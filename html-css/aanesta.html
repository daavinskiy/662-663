<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Äänestä</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="container mt-4">

  <h1>Äänestä</h1>

  <form id="voteForm">
    <div class="mb-3">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="option" id="option1" value="Vaihtoehto 1">
        <label class="form-check-label" for="option1">Vaihtoehto 1</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="option" id="option2" value="Vaihtoehto 2">
        <label class="form-check-label" for="option2">Vaihtoehto 2</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="option" id="option3" value="Vaihtoehto 3">
        <label class="form-check-label" for="option3">Vaihtoehto 3</label>
      </div>
    </div>

    <button type="button" class="btn btn-primary" onclick="submitVote()">Vahvista</button>
  </form>

  <script>
    function submitVote() {
      alert("Ääni tallennettu!");
      document.getElementById('voteForm').reset();
    }
  </script>

</body>
</html>
