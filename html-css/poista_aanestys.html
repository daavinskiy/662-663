<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Poista äänestys</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="container mt-4">

  <h1>Poista äänestys</h1>

  <div class="mb-3">
    <label class="form-label">Valitse poistettava äänestys</label>
    <select class="form-select" id="pollList">
      <option value="1">Äänestys 1</option>
      <option value="2">Äänestys 2</option>
      <option value="3">Äänestys 3</option>
    </select>
  </div>

  <button type="button" class="btn btn-danger" onclick="deletePoll()">Poista äänestys</button>

  <script>
    function deletePoll() {
      alert("Äänestys poistettu!");
    }
  </script>

</body>
</html>
