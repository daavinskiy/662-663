<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Katso äänestystilanne</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="container mt-4">

  <h1>Äänestystilanne</h1>

  <div class="mb-3">
    <label class="form-label">Valitse äänestys</label>
    <select class="form-select" id="pollSelect">
      <option value="1">Äänestys 1</option>
      <option value="2">Äänestys 2</option>
      <option value="3">Äänestys 3</option>
    </select>
  </div>

  <ul class="list-group mt-3" id="resultsList">
    <li class="list-group-item">Vaihtoehto 1: 10 ääntä</li>
    <li class="list-group-item">Vaihtoehto 2: 5 ääntä</li>
    <li class="list-group-item">Vaihtoehto 3: 2 ääntä</li>
  </ul>

</body>
</html>
